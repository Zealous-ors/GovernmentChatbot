<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tanzania Government Services AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <h1>Government Services AI</h1>

        <button id="themeToggle">
            🌙
        </button>
    </header>


    <main class="chat-container">

        <section id="chatBox" class="chat-box">

            <div class="message bot">
                Hello! 👋 How can I help you with Tanzania
                government services today?
            </div>

        </section>


        <form id="chatForm" class="chat-form">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask about government services..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </main>


    <script src="app.js"></script>

</body>
</html>
