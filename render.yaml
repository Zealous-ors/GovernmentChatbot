services:
  - type: web
    name: government-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
